<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дитячі розвивалки - Giveaway</title>

    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <style>
      html {
        box-sizing: border-box;
        font-size: 16px;
      }

      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }

      body,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      ol,
      ul {
        margin: 0;
        padding: 0;
        font-weight: normal;
      }

      ol,
      ul {
        list-style: none;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      body {
        font-size: 16px;
        font-family: 'Open Sans', serif;
      }

      .content {
        width: 900px;
        margin: 0 auto;
        padding-top: 10%;
      }

      .content__logo {
        display: block;
        margin: 0 auto 10px;
      }

      .content__title {
        font-size: 22px;
        margin: 0 0 20px;
        text-align: center;
        font-weight: bold;
        letter-spacing: 5px;
        background: linear-gradient(to right, #6666ff, #0099ff, #00ff00, #ff3399, #6666ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: rainbowAnimation 6s ease-in-out infinite;
        background-size: 400% 100%;
      }

      .form__text-field {
        padding: 10px;
        margin: 0;
        border-radius: 3px;
        color: limegreen;
        display: block;
        width: 100%;
        font-size: 16px;
        border: 1px solid tomato;
        margin-bottom: 10px;
      }

      .form__text-field::focus {
        outline: transparent;
      }

      .form__text-field::placeholder {
        color: #c2bebe;
      }

      .button {
        border: 0;
        margin: 0;
        padding: 10px;
        background-color: tomato;
        font-size: 16px;
        font-weight: semibold;
        color: #fff;
        border-radius: 3px;
        cursor: pointer;
      }

      .row__center {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes rainbowAnimation {
        0%,
        100% {
          background-position: 0 0;
        }

        50% {
          background-position: 100% 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="content">
      <img src="./logo.png" width="200" height="200" alt="Дитячі розвивалки - Logo" class="content__logo" />
      <h1 class="content__title">Дитячі розвивалки - Giveaway</h1>

      <form action="#" class="js-form">
        <input
          type="text"
          class="form__text-field"
          name="url"
          required
          placeholder="Посилання на допис в TikTok: https://www.tiktok.com/@dityachi_rozvyvalky/video/7432963056130379013"
        />

        <div class="row__center">
          <button type="submit" class="button">Дізнатись переможця 🥳</button>
        </div>
      </form>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
