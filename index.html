<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дитячі розвивалки - Giveaway</title>

    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --color-1: rgb(235, 71, 71);
        --color-2: rgb(235, 235, 71);
        --color-3: rgb(71, 235, 71);
        --color-4: rgb(71, 235, 235);
        --color-5: rgb(71, 71, 235);
      }
    </style>

    <link rel="stylesheet" href="./loader.css" />

    <style>
      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }

      body,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      ol,
      ul {
        margin: 0;
        padding: 0;
        font-weight: normal;
      }

      ol,
      ul {
        list-style: none;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      body {
        font-size: 16px;
        font-family: 'Open Sans', serif;
      }

      a {
        color: var(--color-5);
      }

      *:focus,
      *:focus-within {
        outline: none;
      }

      .hide {
        display: none !important;
      }

      .layout {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .content {
        max-width: 900px;
        padding: 2%;
      }

      .content__logo {
        display: block;
        margin: 0 auto 20px;
      }

      .content__title {
        font-size: 22px;
        margin: 0 0 20px;
        text-align: center;
        font-weight: bold;
        letter-spacing: 5px;
        /* background: linear-gradient(to right, #6666ff, #0099ff, #00ff00, #ff3399, #6666ff); */
        background: linear-gradient(
          to right,
          var(--color-1),
          var(--color-2),
          var(--color-3),
          var(--color-4),
          var(--color-5)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: rainbowAnimation 6s ease-in-out infinite;
        background-size: 400% 100%;
      }

      .form {
        margin-bottom: 20px;
      }

      .form__text-field {
        padding: 10px;
        margin: 0;
        border-radius: 3px;
        color: limegreen;
        display: block;
        width: 100%;
        font-size: 16px;
        border: 1px solid var(--color-1);
        margin-bottom: 20px;
      }

      .form__text-field:placeholder {
        color: #c2bebe;
      }

      .form__text-field:focus {
        box-shadow: 0 0 20px rgb(235, 71, 71, 0.5);
      }

      .button {
        border: 0;
        margin: 0;
        padding: 10px;
        background-color: tomato;
        font-size: 16px;
        font-weight: semibold;
        color: #fff;
        border-radius: 3px;
        cursor: pointer;
      }

      .row__center {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .list {
        display: grid;
        grid-template-columns: auto 1fr;
      }

      .list dt {
        margin: 0 20px 20px;
      }

      .list dt:after {
        content: ':';
      }

      .list dd {
        margin: 0 0 20px;
      }

      .list dt:nth-of-type(1),
      .list dd:nth-of-type(1) {
        color: var(--color-1);
      }

      .list dt:nth-of-type(2),
      .list dd:nth-of-type(2) {
        color: var(--color-3);
      }

      .list dt:nth-of-type(3),
      .list dd:nth-of-type(3) {
        color: var(--color-4);
      }

      .list dt:nth-of-type(4),
      .list dd:nth-of-type(4) {
        color: var(--color-5);
      }

      @keyframes rainbowAnimation {
        0%,
        100% {
          background-position: 0 0;
        }

        50% {
          background-position: 100% 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="content">
        <img src="./logo.png" width="200" height="200" alt="Дитячі розвивалки - Logo" class="content__logo" />
        <h1 class="content__title">Дитячі розвивалки - Giveaway</h1>

        <form action="#" class="form js-form">
          <input
            type="text"
            class="form__text-field"
            name="url"
            required
            placeholder="Посилання на допис в TikTok: https://www.tiktok.com/@dityachi_rozvyvalky/video/7432963056130379013"
          />

          <div class="row__center">
            <button type="submit" class="button">Дізнатись переможця 🥳</button>
          </div>
        </form>

        <div class="result">
          <div class="loader hide js-loader">
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
          </div>
        </div>

        <dl class="list hide js-list">
          <dt>Переміг коментар під номером</dt>
          <dd class="js-comment-index"></dd>

          <dt>Текст коментаря</dt>
          <dd class="js-comment-text"></dd>

          <dt>Нік-нейм</dt>
          <dd class="js-username"></dd>

          <dt>Посилання на профіль</dt>
          <dd>
            <a href="" class="js-profile-link"></a>
          </dd>
        </dl>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
