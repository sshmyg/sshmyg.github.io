<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Дитячі розвивалки - Giveaway</title>

    <link rel="icon" type="image/x-icon" href="./favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./main.css" />
    <link rel="stylesheet" href="./loader.css" />
  </head>
  <body>
    <main class="layout">
      <section class="content">
        <img src="./logo.png" width="200" height="200" alt="Дитячі розвивалки - Logo" class="content__logo" />
        <h1 class="content__title">Дитячі розвивалки - Giveaway</h1>

        <form action="#" class="form js-form">
          <input
            type="text"
            class="form__text-field"
            name="url"
            required
            placeholder="Посилання на допис в TikTok: https://www.tiktok.com/@dityachi_rozvyvalky/video/7432963056130379013"
          />

          <div class="row__center">
            <button type="submit" class="button">Дізнатись переможця 🥳</button>
          </div>
        </form>

        <div class="result">
          <div class="loader hide js-loader">
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
            <div class="loader-line-wrap">
              <div class="loader-line"></div>
            </div>
          </div>
        </div>

        <dl class="list hide js-list">
          <dt>Переміг коментар під номером</dt>
          <dd class="js-comment-index"></dd>

          <dt>Текст коментаря</dt>
          <dd class="js-comment-text"></dd>

          <dt>Нік-нейм</dt>
          <dd class="js-username"></dd>

          <dt>Посилання на профіль</dt>
          <dd>
            <a href="" class="js-profile-link"></a>
          </dd>
        </dl>
      </section>
    </main>

    <script src="./main.js"></script>
  </body>
</html>
